name: Build Windows EXE

on:
  workflow_dispatch:

# ============================================================
# Force Python / packaged executable to use UTF-8
# ============================================================

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"


jobs:

  build-windows:

    # ========================================================
    # Build on a real Windows GitHub runner
    # ========================================================

    runs-on: windows-latest


    steps:

      # ======================================================
      # 1. Checkout source
      # ======================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ======================================================
      # 2. Setup Python 3.9
      # ======================================================

      - name: Setup Python 3.9
        uses: actions/setup-python@v5

        with:
          python-version: "3.9"


      # ======================================================
      # 3. Show environment information
      # ======================================================

      - name: Check environment
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Build Environment"
          Write-Host "========================================"

          python --version

          Write-Host ""
          Write-Host "Python executable:"
          python -c "import sys; print(sys.executable)"

          Write-Host ""
          Write-Host "Console encoding:"
          python -c "import sys; print(sys.stdout.encoding)"

          Write-Host "========================================"


      # ======================================================
      # 4. Install dependencies
      # ======================================================

      - name: Install dependencies
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Installing dependencies"
          Write-Host "========================================"
          Write-Host ""

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # ======================================================
      # 5. Verify dependencies
      # ======================================================

      - name: Check dependencies
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Dependency Check"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "pycountry:"
          python -c "import pycountry; print(pycountry.__version__)"

          Write-Host ""
          Write-Host "Akamai EdgeGrid:"
          python -c "from akamai.edgegrid import EdgeGridAuth; print('EdgeGrid OK')"

          Write-Host ""
          Write-Host "PyInstaller:"
          python -m PyInstaller --version

          Write-Host ""
          Write-Host "========================================"


      # ======================================================
      # 6. Check Windows ICO
      # ======================================================

      - name: Check Windows ICO
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Checking Windows icon"
          Write-Host "========================================"

          if (-Not (Test-Path ".\akamai-header-tool.ico")) {
              Write-Host ""
              Write-Host "ERROR: akamai-header-tool.ico was not found."
              Write-Host ""
              exit 1
          }

          Write-Host ""
          Write-Host "Icon file found:"
          Get-Item ".\akamai-header-tool.ico"

          Write-Host ""
          Write-Host "========================================"


      # ======================================================
      # 7. Build Windows EXE
      # ======================================================

      - name: Build Windows EXE
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Building Windows executable"
          Write-Host "========================================"
          Write-Host ""

          python -m PyInstaller `
            --clean `
            --onefile `
            --name akamai-header-tool `
            --icon akamai-header-tool.ico `
            --collect-all pycountry `
            --collect-all akamai `
            main.py

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PyInstaller finished"
          Write-Host "========================================"


      # ======================================================
      # 8. Check generated EXE
      # ======================================================

      - name: Check Windows EXE
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Checking generated executable"
          Write-Host "========================================"

          if (-Not (Test-Path ".\dist\akamai-header-tool.exe")) {
              Write-Host ""
              Write-Host "ERROR: dist\akamai-header-tool.exe was not generated."
              Write-Host ""
              exit 1
          }

          Write-Host ""
          Write-Host "Windows executable generated successfully:"
          Get-Item ".\dist\akamai-header-tool.exe"

          Write-Host ""
          Write-Host "========================================"


      # ======================================================
      # 9. Test executable
      #
      # main.py handles UTF-8 stdout/stderr.
      # This verifies that the packaged EXE can output
      # the Chinese command-line help correctly.
      # ======================================================

      - name: Test Windows EXE
        shell: pwsh

        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"

        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Testing executable with --help"
          Write-Host "========================================"
          Write-Host ""

          .\dist\akamai-header-tool.exe --help

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "ERROR: Executable test failed."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Executable test passed"
          Write-Host "========================================"


      # ======================================================
      # 10. Upload EXE artifact
      # ======================================================

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4

        with:
          name: akamai-header-tool-windows
          path: dist/akamai-header-tool.exe
          if-no-files-found: error
          retention-days: 30
