name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependencies
        shell: powershell
        run: |
          python --version
          python -c "import pycountry; print('pycountry:', pycountry.__version__)"
          python -c "from akamai.edgegrid import EdgeGridAuth; print('EdgeGrid OK')"
          python -m PyInstaller --version

      - name: Build Windows EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --clean `
            --onefile `
            --name akamai-header-tool `
            --icon akamai-header-tool.ico `
            --collect-all pycountry `
            --collect-all akamai `
            main.py

      - name: Test Windows EXE
        shell: powershell
        run: |
          .\dist\akamai-header-tool.exe --help

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: akamai-header-tool-windows
          path: dist/akamai-header-tool.exe